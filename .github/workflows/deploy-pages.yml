name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Prepare Pages entry point
        run: cp dist/app.html dist/index.html
      - name: Sync built site to repository
        run: |
          rm -rf assets
          mkdir -p assets
          cp -R dist/assets/. assets/
          cp dist/index.html index.html
          cp dist/favicon.svg favicon.svg
          cp dist/icons.svg icons.svg
          cp dist/oopy-logo.svg oopy-logo.svg
          cp dist/oopy-original.webp public/oopy-original.webp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.html assets favicon.svg icons.svg oopy-logo.svg public/oopy-original.webp
          if git diff --cached --quiet; then
            echo "No generated site changes to commit."
          else
            git commit -m "Sync built Oopy Studios site [skip ci]"
            git push
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
